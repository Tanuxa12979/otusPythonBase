{% extends 'store_app/base.html' %}
{% block content %}
<h5> Список доступных товаров: </h5>
<table>
    <tr>
        <td>Наименование</td>
        <td>Описание</td>
        <td>Цена</td>
    </tr>
    {% for product in products %}
    <tr>
        <td> <a href="{% url 'product' product.id%}" > {{ product.name }} </a></td>
        <td>{{ product.description }}</td>
        <td>{{ product.price }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
